<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scorepion — Legal</title>
    <meta name="description" content="Scorepion legal pages: privacy policy and account & data deletion." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --ink: #0e1726; --muted: #6b7686; --emerald: #00a651;
        --emerald-dark: #007a3d; --navy: #060d1f; --bg: #f5f6f8;
        --card: #ffffff; --border: #e7eaef;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; flex-direction: column;
        background: radial-gradient(120% 90% at 50% -10%, #0c1a33 0%, var(--navy) 55%);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { flex: 1; display: grid; place-items: center; padding: 40px 20px; }
      .panel { width: 100%; max-width: 460px; text-align: center; }
      .brand { display: inline-flex; align-items: center; gap: 14px; margin-bottom: 6px; }
      .brand svg { width: 56px; height: 56px; }
      .brand b { font-size: 28px; letter-spacing: -0.4px; }
      .tag { color: #9fb0c9; margin: 6px 0 28px; font-size: 15px; }
      .links { display: grid; gap: 12px; }
      .links a {
        display: flex; align-items: center; justify-content: space-between;
        background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px; padding: 16px 20px; color: #fff; text-decoration: none;
        font-weight: 600; transition: background 0.15s, border-color 0.15s;
      }
      .links a:hover { background: rgba(0, 166, 81, 0.12); border-color: var(--emerald); }
      .links a span.arrow { color: var(--emerald); font-size: 20px; }
      footer { color: #6b7686; font-size: 13px; text-align: center; padding: 20px; }
    </style>
  </head>
  <body>
    <main>
      <div class="panel">
        <span class="brand">

            <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">

              <path d="M 36 27 Q 44 23, 46 26" stroke-width="2.2" />
              <path d="M 26 30 L 20 32" stroke-width="1.6" />
              <path d="M 26 36 L 20 39" stroke-width="1.6" />
              <path d="M 38 30 L 44 32" stroke-width="1.6" />
              <path d="M 38 36 L 44 39" stroke-width="1.6" />
              <path d="M 37 42 Q 40 38, 42 32 Q 43 26, 41 20 Q 40 18, 38 19" stroke-width="2.2" />
              <path d="M 38 19 L 39 14 L 42 17 Z" fill="#fff" stroke="none" />
            </g>
          </svg>
          <b>Scorepion</b>
        </span>
        <div class="tag">Football prediction game · Legal</div>
        <div class="links">
          <a href="privacy.html">Privacy Policy <span class="arrow">→</span></a>
          <a href="account-deletion.html">Account &amp; Data Deletion <span class="arrow">→</span></a>
        </div>
      </div>
    </main>
    <footer>© 2026 Coodehub · support@scorepion.fans</footer>

</html>
